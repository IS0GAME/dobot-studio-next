<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep slate / obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Cyan Arm Gradient -->
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Secondary Link Gradient -->
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Joint Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Arm -->
    <filter id="armShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Tile (Pure transparent outside) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Blueprint / Grid Arc Backdrop -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <circle cx="170" cy="360" r="120" stroke-dasharray="4,6" />
    <circle cx="170" cy="360" r="180" stroke-dasharray="4,6" />
    <circle cx="170" cy="360" r="240" stroke-dasharray="4,6" />
    <line x1="60" y1="360" x2="450" y2="360" stroke-dasharray="6,6" />
  </g>

  <!-- Robot Arm Assembly Group -->
  <g filter="url(#armShadow)">
    <!-- Base Pedestal (Clean geometric bevel) -->
    <path d="M 115 372 L 225 372 L 210 348 L 130 348 Z" fill="#334155" />
    <rect x="135" y="325" width="70" height="24" rx="4" fill="#475569" />

    <!-- Joint 1 Base Turret Ring -->
    <circle cx="170" cy="330" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <circle cx="170" cy="330" r="10" fill="#38bdf8" />

    <!-- Rear Arm Link (Link 1: 170,330 -> 245,190) -->
    <!-- Mechanical Parallel Linkage Rod -->
    <line x1="152" y1="312" x2="227" y2="172" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
    
    <!-- Primary Rear Arm Beam -->
    <line x1="170" y1="330" x2="245" y2="190" stroke="url(#linkGrad)" stroke-width="20" stroke-linecap="round" />
    <line x1="170" y1="330" x2="245" y2="190" stroke="#0f172a" stroke-width="6" stroke-linecap="round" opacity="0.15" />

    <!-- Joint 2 Elbow Hub -->
    <circle cx="245" cy="190" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" />
    <circle cx="245" cy="190" r="8" fill="#38bdf8" />

    <!-- Forearm Link (Link 2: 245,190 -> 360,265) -->
    <!-- Upper Parallel Rod -->
    <line x1="245" y1="168" x2="360" y2="243" stroke="#0284c7" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- Main Forearm Beam -->
    <line x1="245" y1="190" x2="360" y2="265" stroke="url(#armGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Joint 3 Wrist Pivot -->
    <circle cx="360" cy="265" r="18" fill="#0f172a" stroke="#f8fafc" stroke-width="3" />
    <circle cx="360" cy="265" r="6" fill="#38bdf8" />

    <!-- End-Effector / Tool Mount -->
    <!-- Vertical tool stem -->
    <path d="M 354 275 L 366 275 L 364 315 L 356 315 Z" fill="#94a3b8" />
    
    <!-- Tool Suction / Gripper Nozzle -->
    <rect x="350" y="315" width="20" height="7" rx="2" fill="#38bdf8" />
    <rect x="355" y="322" width="10" height="12" rx="2" fill="#f8fafc" />

    <!-- Precision Focal Point / Target Laser Glow -->
    <circle cx="360" cy="342" r="4.5" fill="#38bdf8" filter="url(#cyanGlow)" />
    <circle cx="360" cy="342" r="2" fill="#ffffff" />

    <!-- Subtle Motion Track Arc -->
    <path d="M 330 200 A 75 75 0 0 1 385 275" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,4" opacity="0.6" />
  </g>

  <!-- Modern Subtle Typographic Wordmark inside Icon -->
  <text x="256" y="442" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#94a3b8" opacity="0.8">
    DOBOT <tspan fill="#38bdf8">NEXT</tspan>
  </text>
</svg>
