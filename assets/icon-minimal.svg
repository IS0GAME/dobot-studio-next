<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Blue Gradient: Deep Midnight Navy to Rich Royal Blue -->
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="60%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Subtle Cyan Edge Stroke -->
    <linearGradient id="edgeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Dark Blue Gradient Squircle Base (100% Transparent Outside) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgBlue)" stroke="url(#edgeStroke)" stroke-width="2.5" />

  <!-- Iconic Clean White Letter "D" (Geometric Vector Path) -->
  <!-- Outer D: x=160 to 360, y=140 to 372. Inner counter: x=224 to 296, y=204 to 308 -->
  <path d="M 160 140
           L 270 140
           C 336 140, 368 178, 368 256
           C 368 334, 336 372, 270 372
           L 160 372
           Z
           M 224 200
           L 224 312
           L 264 312
           C 298 312, 308 290, 308 256
           C 308 222, 298 200, 264 200
           Z"
        fill="#ffffff"
        fill-rule="evenodd" />
</svg>
