[package]
name = "dobot-studio-core"
version = "2.0.0"
description = "Pure-Rust High-Performance Core for Dobot Magician"
edition = "2021"

[lib]
name = "dobot_studio_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dobot-studio"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-serial = "5.4"
warp = "0.3"
futures-util = "0.3"
nalgebra = "0.33"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-test = "0.4"
